<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GrokThink</title>
<link rel="stylesheet" href="style.css">
<!-- each control's own rules, assembled by the Bridge from its class node -->
<link rel="stylesheet" href="widgets.css">
</head>
<body>

<div id="topbar">
  <div id="topbar-menus"></div>
</div>

<div id="main">

  <div id="canvas-wrap">
    <svg id="wires"></svg>
    <div id="canvas"></div>
  </div>

</div>

<!-- connection state is the whole screen, not a word in a corner: while
     the session is not live the canvas is greyed out and unclickable, so
     nothing can be fiddled with against a server that isn't there -->
<div id="offline"><span id="offline-msg">disconnected</span></div>

<!-- what the controls themselves brought: assembled by the Bridge from
     each class's own Presentation/web, loaded before the host so the
     registrations exist by the time anything is rendered -->
<script src="widgets.js"></script>
<script src="app.js"></script>
</body>
</html>
